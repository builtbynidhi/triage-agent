# Install, secret scan, lint, format, typecheck, seed and index from clean, then all tests.
# Phase 12 adds npm audit, the replay-mode eval suite, the baseline gate and the PR scorecard comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-secrets.sh --all
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Local embedding and reranker models (about 60 MB), downloaded once from the public
      # Hugging Face hub, then restored from the cache. No API keys, no cost.
      - name: Cache local models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('packages/data/src/retrieval/defaults.ts', 'packages/data/src/retrieval/embedder.ts', 'packages/data/src/retrieval/rerank.ts') }}
          restore-keys: models-
      - name: db reset, seed and vector index from clean
        run: pnpm db:reset && pnpm db:seed && pnpm db:index
      - run: pnpm test
